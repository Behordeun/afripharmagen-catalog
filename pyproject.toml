[project]
name = "afripharmagen-catalog"
version = "0.2.1"
description = "Curated pharmacogenomic data and reproducible analyses for sub-Saharan African populations"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Abiodun SULAIMAN", email = "abiodun.msulaiman@gmail.com" },
    { name = "Bolaji Fatai OYEYEMI", email = "bolajioyeyemi@gmail.com" },
]
readme = "README.md"
keywords = [
    "pharmacogenomics",
    "african",
    "allele-frequencies",
    "CYP2D6",
    "CYP2B6",
    "precision-medicine",
    "1000-genomes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24.0,<3.0",
    "scipy>=1.11.0,<2.0",
    "matplotlib>=3.8.0,<4.0",
]

[project.urls]
Repository = "https://github.com/Behordeun/afripharmagen-catalog"

[project.scripts]
afripharmagen-catalog = "run_analyses:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = [
    "run_analyses.py",
    "analyses/",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
